name: Retry Pages deployment

on:
  workflow_run:
    workflows: [pages-build-deployment]
    types: [completed]

jobs:
  retry:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt <= 2
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Rerun failed Pages jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run rerun ${{ github.event.workflow_run.id }} --repo ${{ github.repository }} --failed
